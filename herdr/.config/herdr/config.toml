[theme]
name = "catppuccin"

auto_switch = false
[keys]
prefix = "ctrl+space"
split_vertical = "prefix+|"
rename_tab = "prefix+r"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"

[ui]
pane_gaps = false

show_agent_labels_on_pane_borders = false
[session]
resume_agents_on_restore = true

[ui.toast]
delivery = "herdr"
